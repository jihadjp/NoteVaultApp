# ─────────────────────────────────────────────────────────────────────────────
# NoteVault DIU — Version Catalog (libs.versions.toml)
# Compatible with Android Studio Ladybug+ / AGP 8.x / compileSdk 36
# ─────────────────────────────────────────────────────────────────────────────

[versions]

# Android build tools
agp                     = "9.1.1"

# AndroidX core
appcompat               = "1.7.1"
activity                = "1.13.0"
constraintlayout        = "2.2.1"
recyclerview            = "1.4.0"
cardview                = "1.0.0"
swiperefreshlayout      = "1.2.0"

# Material Design
material                = "1.14.0"

# Lifecycle (ViewModel + LiveData)
lifecycle               = "2.11.0"

# Room
room                    = "2.8.4"

# Retrofit + OkHttp
retrofit                = "3.0.0"
okhttp                  = "5.4.0"

# Glide
glide                   = "5.0.7"

# PDF Viewer (Maven Central — oothp fork of barteksc, actively maintained)
androidPdfViewer        = "3.2.0-beta06"
# Shimmer (Facebook)
shimmer                 = "0.5.0"

# WorkManager
work                    = "2.11.2"

# Testing
junit                   = "4.13.2"
junitExt                = "1.3.0"
espresso                = "3.7.0"

# ─────────────────────────────────────────────────────────────────────────────
[libraries]
# ─────────────────────────────────────────────────────────────────────────────

# AndroidX core
appcompat               = { group = "androidx.appcompat",       name = "appcompat",             version.ref = "appcompat" }
activity                = { group = "androidx.activity",        name = "activity",              version.ref = "activity" }
constraintlayout        = { group = "androidx.constraintlayout",name = "constraintlayout",      version.ref = "constraintlayout" }
recyclerview            = { group = "androidx.recyclerview",    name = "recyclerview",          version.ref = "recyclerview" }
cardview                = { group = "androidx.cardview",        name = "cardview",              version.ref = "cardview" }
swiperefreshlayout      = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }

# Material
material                = { group = "com.google.android.material", name = "material",           version.ref = "material" }

# Lifecycle
lifecycle-viewmodel     = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel",   version.ref = "lifecycle" }
lifecycle-livedata      = { group = "androidx.lifecycle",      name = "lifecycle-livedata",    version.ref = "lifecycle" }
lifecycle-common-java8  = { group = "androidx.lifecycle",      name = "lifecycle-common-java8",version.ref = "lifecycle" }

# Room
room-runtime            = { group = "androidx.room",           name = "room-runtime",          version.ref = "room" }
room-compiler           = { group = "androidx.room",           name = "room-compiler",         version.ref = "room" }

# Retrofit
retrofit                = { group = "com.squareup.retrofit2",  name = "retrofit",              version.ref = "retrofit" }
retrofit-gson           = { group = "com.squareup.retrofit2",  name = "converter-gson",        version.ref = "retrofit" }
okhttp-logging          = { group = "com.squareup.okhttp3",    name = "logging-interceptor",   version.ref = "okhttp" }

# Glide
glide                   = { group = "com.github.bumptech.glide", name = "glide",              version.ref = "glide" }
glide-compiler          = { group = "com.github.bumptech.glide", name = "compiler",           version.ref = "glide" }

# PDF Viewer (Maven Central — io.github.oothp fork, replaces dead barteksc JitPack)
android-pdf-viewer      = { group = "io.github.oothp",        name = "android-pdf-viewer",    version.ref = "androidPdfViewer" }

# Shimmer
shimmer                 = { group = "com.facebook.shimmer",    name = "shimmer",               version.ref = "shimmer" }

# WorkManager
work-runtime            = { group = "androidx.work",           name = "work-runtime",          version.ref = "work" }

# Testing
junit                   = { group = "junit",                   name = "junit",                 version.ref = "junit" }
ext-junit               = { group = "androidx.test.ext",       name = "junit",                 version.ref = "junitExt" }
espresso-core           = { group = "androidx.test.espresso",  name = "espresso-core",         version.ref = "espresso" }

# ─────────────────────────────────────────────────────────────────────────────
[plugins]
# ─────────────────────────────────────────────────────────────────────────────

android-application     = { id = "com.android.application",   version.ref = "agp" }
