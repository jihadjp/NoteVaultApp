// ─────────────────────────────────────────────────────────────────────────────
// NoteVault DIU — app/build.gradle
// Uses version catalog (gradle/libs.versions.toml)
// compileSdk 36 · Java 11 · AGP 8.5.x
// ─────────────────────────────────────────────────────────────────────────────

plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.jptechgenius.notevault'
    compileSdk 36

    defaultConfig {
        applicationId "com.jptechgenius.notevault"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // ── AndroidX Core ────────────────────────────────────────────────────────
    implementation libs.appcompat
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.swiperefreshlayout

    // ── Material Design ──────────────────────────────────────────────────────
    implementation libs.material

    // ── Lifecycle: ViewModel + LiveData ──────────────────────────────────────
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.common.java8

    // ── Room Database ────────────────────────────────────────────────────────
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // ── Retrofit + OkHttp ────────────────────────────────────────────────────
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp.logging

    // ── Glide (image thumbnails) ──────────────────────────────────────────────
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // ── PDF Viewer (JitPack — barteksc) ──────────────────────────────────────
    implementation libs.android.pdf.viewer

    // ── Shimmer loading effect ────────────────────────────────────────────────
    implementation libs.shimmer

    // ── WorkManager (background tasks) ───────────────────────────────────────
    implementation libs.work.runtime

    // ── Testing ──────────────────────────────────────────────────────────────
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
